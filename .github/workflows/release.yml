# Builds a signed release APK for every pushed version tag (v1.2.3) and attaches it
# to the GitHub release of that tag. The release is created if it does not exist yet.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper jar is the official one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          LAUSCHER_KEYSTORE: ${{ runner.temp }}/release.jks
          LAUSCHER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LAUSCHER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LAUSCHER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "brabbely-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: brabbely-${{ github.ref_name }}.apk
          generate_release_notes: true
